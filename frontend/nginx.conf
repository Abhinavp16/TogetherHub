server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (e.g. /code/<id>) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
